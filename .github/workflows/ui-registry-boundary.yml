name: UI Registry Boundary

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/check-ui-registry-boundary.mjs'
      - 'scripts/check-ui-registry-adoption.mjs'
      - 'scripts/check-ai-chat-ui-contract.mjs'
      - 'scripts/check-txs-public-tokens.mjs'
      - 'scripts/check-space-background-tokens.mjs'
      - 'scripts/check-legal-notice-ui.mjs'
      - 'scripts/measure-ui-bespoke.mjs'
      - 'docs/UI_REGISTRY_ABSORPTION_WAVE_01.md'
      - 'docs/UI_REGISTRY_ADOPTION.json'
      - '.github/workflows/ui-registry-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/check-ui-registry-boundary.mjs'
      - 'scripts/check-ui-registry-adoption.mjs'
      - 'scripts/check-ai-chat-ui-contract.mjs'
      - 'scripts/check-txs-public-tokens.mjs'
      - 'scripts/check-space-background-tokens.mjs'
      - 'scripts/check-legal-notice-ui.mjs'
      - 'scripts/measure-ui-bespoke.mjs'
      - 'docs/UI_REGISTRY_ADOPTION.json'
      - '.github/workflows/ui-registry-boundary.yml'

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject direct 21st.dev product imports
        run: node scripts/check-ui-registry-boundary.mjs
      - name: Validate governed UI registry adoption
        run: node scripts/check-ui-registry-adoption.mjs
      - name: Validate governed AI chat UI
        run: node scripts/check-ai-chat-ui-contract.mjs
      - name: Validate Tellinex TXS public tokens
        run: node scripts/check-txs-public-tokens.mjs
      - name: Validate TXS canvas rendering tokens
        run: node scripts/check-space-background-tokens.mjs
      - name: Validate legal notice truth and presentation
        run: node scripts/check-legal-notice-ui.mjs
      - name: Measure bespoke UI and prevent governed regression
        run: node scripts/measure-ui-bespoke.mjs
      - name: Upload bespoke UI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-ui-bespoke-report
          path: reports/ui-bespoke-report.json
          if-no-files-found: warn
          retention-days: 14
