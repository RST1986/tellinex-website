name: Copilot Auto Review

# COST CONTROL: request an automatic Copilot review at meaningful PR lifecycle
# boundaries only. Do not request another AI review on every synchronize event;
# a deliberate follow-up review can still be requested from the PR UI after
# substantive changes.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: copilot-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request-copilot-review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Request GitHub Copilot code review
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                reviewers: ['copilot-pull-request-reviewer[bot]']
              });
              core.info(`Requested Copilot review for PR #${context.payload.pull_request.number}`);
            } catch (error) {
              if (error.status === 422) {
                core.warning(`Copilot review could not be requested: ${error.message}`);
                return;
              }
              throw error;
            }
