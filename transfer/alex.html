<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Site Survey</title>
<meta name="theme-color" content="#0b3d61">
<style>
:root{--bg:#f2f5f8;--card:#fff;--ink:#16232e;--mut:#5b6b78;--line:#dbe3ea;--brand:#0b3d61;--acc:#0a84c1;--ok:#177a4c;--warn:#b26a00;--bad:#b3261e;--chip:#e8eff5}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:90px}
header.top{position:sticky;top:0;z-index:30;background:var(--brand);color:#fff;padding:10px 14px calc(8px + env(safe-area-inset-top)) 14px;padding-top:calc(10px + env(safe-area-inset-top));box-shadow:0 2px 8px rgba(0,0,0,.18)}
.toprow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.toprow h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
.jobref{margin-left:auto;font-weight:700;font-size:14px;background:rgba(255,255,255,.14);padding:4px 10px;border-radius:999px}
.sync{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px}
.sync.off{background:rgba(255,255,255,.14);color:#cfe0ec}
.sync.run{background:#ffd76a;color:#5c4300}
.sync.ok{background:#6fd3a2;color:#0b3d2a}
.sync.err{background:#ff9b8f;color:#5c150d}

.pbar{height:5px;border-radius:99px;background:rgba(255,255,255,.22);margin-top:8px;overflow:hidden}
.pfill{height:100%;background:#6fd3a2;width:0%;transition:width .3s}
.pmeta{display:flex;justify-content:space-between;font-size:11.5px;opacity:.92;margin-top:4px}
nav.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none;position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 75%,transparent)}
nav.chips::-webkit-scrollbar{display:none}
nav.chips a{flex:0 0 auto;background:var(--chip);color:var(--brand);text-decoration:none;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:999px;border:1px solid var(--line)}
nav.chips a.done{background:#dff1e7;border-color:#bfe3cf;color:var(--ok)}
main{max-width:760px;margin:0 auto;padding:0 12px}
section.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:12px 0;padding:14px 14px 6px;box-shadow:0 1px 3px rgba(20,40,60,.05)}
section.card h2{font-size:15px;margin:0 0 10px;color:var(--brand);display:flex;align-items:center;gap:8px}
section.card h2 .cnt{margin-left:auto;font-size:11.5px;color:var(--mut);font-weight:600}
.q{margin:0 0 14px}
.q label.main{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 0 auto;min-width:84px;min-height:46px;border:1.5px solid var(--line);background:#fff;border-radius:10px;font-size:15px;font-weight:600;color:var(--ink)}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.seg button.onNo{background:#8a1f18;border-color:#8a1f18;color:#fff}
input[type=text],input[type=tel],input[type=email],input[type=date],select,textarea{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;background:#fff;color:var(--ink)}
textarea{min-height:74px;resize:vertical}
.banner{display:none;background:var(--bad);color:#fff;font-weight:800;text-align:center;padding:14px;border-radius:12px;margin:12px 0;letter-spacing:.5px}
.banner.show{display:block}
.slot{border:1px dashed var(--line);border-radius:12px;padding:10px;margin:0 0 12px;background:#fbfdfe}
.slot .st{font-weight:600;font-size:13.5px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.slot .mirror{margin-left:auto;font-size:11px;color:var(--mut);background:var(--chip);border-radius:99px;padding:2px 8px}
.slot .aist{font-size:11px;color:#0a84c1;font-weight:700}
.snapRow{display:flex;gap:8px;margin-bottom:8px}
.snapRow label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border-radius:10px;font-weight:700;font-size:14px;border:1.5px solid var(--acc);color:var(--acc);background:#fff}
.snapRow label.cam{background:var(--acc);color:#fff}
.snapRow input{display:none}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.thumbs .ph{position:relative;width:86px;height:86px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .rm{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.62);color:#fff;border:0;border-radius:99px;width:24px;height:24px;font-size:13px;line-height:1}
.sub{margin:6px 0}
.sub input,.sub textarea{min-height:42px;font-size:14.5px}
.sub .lbl{font-size:11.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.morebtn{width:100%;min-height:46px;border:1.5px dashed var(--acc);color:var(--acc);background:#fff;border-radius:10px;font-weight:700;font-size:14px;margin-bottom:12px}
.ai{background:linear-gradient(135deg,#0b3d61,#0a84c1);border:none;color:#fff;border-radius:12px;padding:12px;margin:12px 0;color:#fff}
.ai h2{color:#fff;font-size:15px;margin:0 0 8px}
.ai textarea{border:none;margin-bottom:8px}
.ai .row{display:flex;gap:8px}
.ai button{flex:1;min-height:46px;border:0;border-radius:10px;font-weight:700;font-size:14px;background:#fff;color:var(--brand)}
.ai .msg{font-size:12.5px;margin-top:6px;min-height:16px}
.ai .uprow{display:flex;gap:8px;margin-bottom:8px}
.ai .uprow label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border-radius:10px;font-weight:700;font-size:14px;background:rgba(255,255,255,.16);color:#fff;border:1.5px dashed rgba(255,255,255,.6)}
.ai .uprow input{display:none}
.q.review input,.q.review select,.q.review textarea{border-color:#e0a300;background:#fffaf0}
.q.review .seg button.on{outline:3px solid #e0a300}
.q.review label.main::after{content:" ● review";color:#b26a00;font-size:11px;font-weight:800}

footer.bar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:#fff;border-top:1px solid var(--line);display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -2px 10px rgba(20,40,60,.08)}
footer.bar button{flex:1;min-height:48px;border-radius:12px;font-weight:700;font-size:14.5px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
footer.bar button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.saved{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;background:rgba(20,35,46,.92);color:#fff;font-size:12.5px;padding:6px 14px;border-radius:99px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50}
.saved.show{opacity:1}
.menuwrap{position:relative}
dialog{border:none;border-radius:14px;max-width:420px;width:92vw;padding:16px}
dialog h3{margin:0 0 10px}
dialog .list button{display:block;width:100%;text-align:left;margin:6px 0;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px}
dialog .rowb{display:flex;gap:8px;margin-top:12px}
dialog .rowb button{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:600}
.qrow{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;background:#fff}
.qrow .l1{display:flex;gap:8px;align-items:center;font-weight:800;font-size:15px}
.qrow .l1 .pct{margin-left:auto;font-size:12px;color:var(--mut);font-weight:700}
.qrow .l2{font-size:12.5px;color:var(--mut);margin:2px 0 8px}
.qrow .l3{display:flex;gap:6px;flex-wrap:wrap}
.qrow .l3 button{flex:1 0 auto;min-height:40px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:700}
.qrow .l3 button.open{background:var(--brand);border-color:var(--brand);color:#fff;flex:2 0 auto}
.qrow .l3 button.stOn{background:#dff1e7;border-color:#9fd4b6;color:var(--ok)}
.qrow .l3 button.stNo{background:#fdeceb;border-color:#f0b6b2;color:var(--bad)}
.qrow.cur{outline:2.5px solid var(--acc)}
dialog.wide{max-width:560px}
.gap{padding:8px 10px;border-left:3px solid var(--bad);background:#fdf3f2;border-radius:6px;margin:6px 0;font-size:13.5px}
.gap.warn{border-left-color:#e0a300;background:#fffaf0}
.allok{padding:14px;border-radius:10px;background:#dff1e7;color:var(--ok);font-weight:800;text-align:center}
.nabtn{margin-left:auto;font-size:11px;font-weight:700;border:1px solid var(--line);background:var(--chip);color:var(--brand);border-radius:99px;padding:4px 9px}
.locbtn{min-height:42px;min-width:46px;border:1.5px solid var(--acc);color:var(--acc);background:#fff;border-radius:10px;font-size:16px}
.locrow{display:flex;gap:6px}
#siteCheck{display:none;margin:10px 0;padding:10px 12px;border-radius:10px;font-weight:700;font-size:13.5px}
#siteCheck.ok{display:block;background:#dff1e7;color:#177a4c}
#siteCheck.near{display:block;background:#fff3d6;color:#8a5b00}
#siteCheck.far{display:block;background:#fdeceb;color:#b3261e}
.pow{border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:10px;padding:10px;margin:0 0 10px;background:#fbfdfe}
.pow .pt{font-weight:800;font-size:14px}
.pow .pr{font-size:12.5px;color:var(--mut);margin:2px 0 8px}
.pow.done{border-left-color:#177a4c;background:#f4faf7}
.pow .pt .tick{color:#177a4c;margin-right:6px}
.ph .vbadge{position:absolute;left:2px;bottom:2px;border-radius:99px;font-size:12px;padding:2px 6px;font-weight:800;border:0}
.ph .vok{background:rgba(23,122,76,.9);color:#fff}
.ph .vwarn{background:rgba(224,163,0,.95);color:#fff}
#guideBtn{position:fixed;right:14px;bottom:86px;z-index:45;background:var(--acc);color:#fff;border:0;border-radius:99px;padding:13px 18px;font-weight:800;font-size:14px;box-shadow:0 4px 14px rgba(10,132,193,.4)}
#wiz{position:fixed;inset:0;background:#0d1418;color:#fff;z-index:120;display:none;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom))}
#wiz.open{display:flex}
#wiz .prog{font-size:12.5px;color:#8fb3c9;font-weight:700;letter-spacing:.08em}
#wiz h2{font-size:22px;margin:10px 0 6px;line-height:1.25}
#wiz .why{font-size:14.5px;color:#b9cbd8;flex:0 1 auto}
#wiz .verify{margin-top:10px;font-size:13.5px;font-weight:700;min-height:20px}
#wiz .verify.ok{color:#6fd3a2}
#wiz .verify.warn{color:#ffcf66}
#wiz .spacer{flex:1}
#wiz .wbtns{display:flex;flex-direction:column;gap:10px}
#wiz .wbtns label.shoot{display:flex;align-items:center;justify-content:center;background:var(--acc);border-radius:14px;min-height:60px;font-size:18px;font-weight:800}
#wiz .wbtns label.shoot input{display:none}
#wiz .wbtns .row2{display:flex;gap:10px}
#wiz .wbtns .row2 button{flex:1;min-height:48px;border-radius:12px;border:1px solid #33475a;background:#1e3242;color:#dce8f2;font-weight:700}





/* --- annotation editor --- */
#annWrap{position:fixed;inset:0;background:#0d1418;z-index:100;display:none;flex-direction:column}
#annWrap.open{display:flex}
#annTop{display:flex;gap:6px;align-items:center;padding:8px 10px;background:#16232e;flex-wrap:wrap}
#annTop button{min-height:40px;min-width:44px;border-radius:9px;border:1px solid #33475a;background:#1e3242;color:#dce8f2;font-weight:700;font-size:13px;padding:0 10px}
#annTop button.sel{background:#0a84c1;border-color:#0a84c1;color:#fff}
#annTop input[type=color]{width:44px;height:40px;border:none;border-radius:9px;background:none;padding:0}
#annTop select{min-height:40px;border-radius:9px;background:#1e3242;color:#dce8f2;border:1px solid #33475a;font-size:13px}
#annCanvasBox{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
#annCanvas{max-width:100%;max-height:100%;touch-action:none}
#annBottom{display:flex;gap:8px;padding:10px calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-bottom))}
#annBottom button{flex:1;min-height:48px;border-radius:12px;border:0;font-weight:800;font-size:15px}
#annSave{background:#177a4c;color:#fff}
#annCancel{background:#3a4a57;color:#fff}

@media print{
 header.top,nav.chips,footer.bar,.snapRow,.ai,.morebtn,.rm,dialog,.saved{display:none!important}
 body{background:#fff;padding:0}
 section.card{break-inside:avoid;border:1px solid #999;box-shadow:none}
 .thumbs .ph{width:45%;height:auto;max-height:none}
 .thumbs img{height:auto}
 .printhead{display:block!important;font-size:20px;font-weight:800;margin:0 0 12px}
}
.printhead{display:none}
</style>
</head>
<body>
<header class="top">
 <div class="toprow">
  <h1>Site Survey</h1>
  <span class="jobref" id="jobrefBadge">—</span>
  <button type="button" class="sync off" id="syncBadge" style="border:0">local</button>
 </div>
 <div class="pbar"><div class="pfill" id="pfill"></div></div>
 <div class="pmeta"><span id="pAnswered">0 answered</span><span id="pPhotos">0 photos</span></div>
</header>
<nav class="chips" id="chips"></nav>
<main>
 <p class="printhead" id="printhead"></p>
 <div class="banner" id="dnp">DO NOT PROCEED — RESOLVE SAFETY ISSUE</div>
 <div id="siteCheck" role="status"></div>
 <section class="ai" id="aibox">
  <h2>AI · prefill from job pack</h2>
  <div class="uprow"><label>📎 Load job pack files (XLSX / PDF)<input type="file" id="aifiles" accept=".xlsx,.pdf,application/pdf" multiple></label></div>
  <textarea id="aitext" rows="3" placeholder="Paste the planner / job pack text here…"></textarea>
  <div class="row">
   <button type="button" id="aiPrefill">Prefill survey with AI</button>
   <button type="button" id="aiNotes">AI final comments</button>
  </div>
  <div class="msg" id="aimsg"></div>
 </section>
 <section class="card" id="powCard" style="display:none"><h2>Point of work checklist<span class="cnt" id="powCnt"></span></h2><div id="powRoot"></div></section>
 <div id="formRoot"></div>
 <div id="photoRoot"></div>
</main>
<footer class="bar">
 <button type="button" id="btnSurveys">Surveys</button>
 <button type="button" id="btnCheck">Check ✓</button>
 <button type="button" class="primary" id="btnPdf">Export PDF</button>
</footer>
<button type="button" id="guideBtn">▶ Guide me</button>
<div class="saved" id="savedToast">Saved</div>

<div id="wiz">
 <div class="prog" id="wizProg"></div>
 <h2 id="wizTitle"></h2>
 <div class="why" id="wizWhy"></div>
 <div class="verify" id="wizVerify"></div>
 <div class="spacer"></div>
 <div class="wbtns">
  <label class="shoot">📷 Take this photo<input type="file" accept="image/*" capture="environment" id="wizInput"></label>
  <div class="row2">
   <button type="button" id="wizSkip">Skip</button>
   <button type="button" id="wizClose">Exit guide</button>
  </div>
 </div>
</div>

<div id="annWrap">
 <div id="annTop">
  <button type="button" data-tool="arrow" class="sel">→ Arrow</button>
  <button type="button" data-tool="pen">✎ Pen</button>
  <button type="button" data-tool="circle">◯ Circle</button>
  <button type="button" data-tool="text">T Text</button>
  <input type="color" id="annColor" value="#ff2d2d">
  <select id="annWidth"><option value="5">Thin</option><option value="8" selected>Medium</option><option value="14">Thick</option></select>
  <button type="button" id="annUndo">↶</button>
  <button type="button" id="annRedo">↷</button>
  <button type="button" id="annClear">Clear marks</button>
 </div>
 <div id="annCanvasBox"><canvas id="annCanvas"></canvas></div>
 <div id="annBottom">
  <button type="button" id="annCancel">Cancel</button>
  <button type="button" id="annSave">Save annotation</button>
 </div>
</div>


<dialog id="dlgSurveys" class="wide">
 <h3>Work queue</h3><p class="muted" style="font-size:12.5px;color:#5b6b78;margin:0 0 6px">Load all your job packs once — open each survey when the booking happens.</p>
 <div class="list" id="surveyList"></div>
 <div class="rowb">
  <button type="button" id="dlgNew">New survey</button>
  <button type="button" id="btnExport">Backup</button>
  <button type="button" id="dlgImport">Restore</button>
  <button type="button" id="dlgClose">Close</button>
 </div>
 <input type="file" id="importFile" accept="application/json" style="display:none">
</dialog>

<dialog id="dlgCheck">
 <h3>Survey check</h3>
 <div id="checkList"></div>
 <div class="rowb"><button type="button" id="checkClose">Close</button></div>
</dialog>

/* ---------- state ---------- */
let DB=null, S=null, ALL=null;
function blank(ref){return {ref:ref||"", f:{}, com:{}, loc:{}, powCom:{}, points:[], siteGeo:null, verif:{}, civilsMore:false, cablingMore:false, created:new Date().toISOString()};}
function loadAll(){try{ALL=JSON.parse(localStorage.getItem(LSKEY))||null;}catch{ALL=null;}
 if(!ALL||!ALL.surveys){ALL={current:"draft",surveys:{draft:blank("")}};}
 if(!ALL.surveys[ALL.current]) ALL.current=Object.keys(ALL.surveys)[0];
 S=ALL.surveys[ALL.current];}
let saveT=null;
function save(){S.mtime=new Date().toISOString();ALL.surveys[ALL.current]=S;localStorage.setItem(LSKEY,JSON.stringify(ALL));
 scheduleSync();
 clearTimeout(saveT);const t=document.getElementById("savedToast");t.classList.add("show");saveT=setTimeout(()=>t.classList.remove("show"),900);}

/* ---------- IndexedDB photos ---------- */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(IDB,1);
 r.onupgradeneeded=()=>r.result.createObjectStore("ph");
 r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function phPut(key,blob,fromCloud){const db=await idb();await new Promise((res,rej)=>{const tx=db.transaction("ph","readwrite");tx.objectStore("ph").put(blob,key);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});
 if(!fromCloud&&typeof uploadPhoto==="function")void uploadPhoto(key,blob);}
async function phDel(key){const db=await idb();await new Promise((res)=>{const tx=db.transaction("ph","readwrite");tx.objectStore("ph").delete(key);tx.oncomplete=res;});
 if(typeof deleteCloudPhoto==="function")void deleteCloudPhoto(key);}
async function phKeys(prefix){const db=await idb();return new Promise((res)=>{const out=[];const tx=db.transaction("ph");const c=tx.objectStore("ph").openCursor();
 c.onsuccess=e=>{const cur=e.target.result;if(cur){if(String(cur.key).startsWith(prefix))out.push(String(cur.key));cur.continue();}else res(out);};});}
async function phGet(key){const db=await idb();return new Promise((res)=>{const tx=db.transaction("ph");const g=tx.objectStore("ph").get(key);g.onsuccess=()=>res(g.result||null);g.onerror=()=>res(null);});}
function pKey(slot,n){return ALL.current+"::"+slot+"::"+n;}

/* ---------- condition eval ---------- */
function condOk(c){if(c==="always")return true;
 let more=null,parts;
 if(c.indexOf("'Add More' button clicked")>=0){const base=c.split(" AND ")[0];more=base.indexOf("civils")===0?"civilsMore":"cablingMore";parts=[base];}
 else parts=c.split(" AND ").map(x=>x.trim());
 for(const p of parts){if(p.indexOf("=")>=0){const i=p.indexOf("=");if((S.f[p.slice(0,i)]||"")!==p.slice(i+1))return false;}}
 if(more&&!S[more])return false;return true;}

/* ---------- render form ---------- */
function esc(x){return String(x).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[ch]));}
function renderForm(){
 const root=document.getElementById("formRoot");root.innerHTML="";
 for(const sec of SCHEMA.sections){
  const card=document.createElement("section");card.className="card";card.id="sec-"+sec.replace(/\W+/g,"-");
  card.innerHTML="<h2>"+esc(sec)+"<span class='cnt' data-cnt></span></h2>";
  if(sec!=="Point-of-Work Safety Check"){
   const na=document.createElement("button");na.type="button";na.className="nabtn";na.textContent="Rest \u2192 No";
   na.addEventListener("click",()=>{let n=0;
    for(const f of SCHEMA.fields){if(f.s!==sec||f.t!=="radio")continue;
     if(!condOk(f.c))continue;if((S.f[f.n]||"").trim())continue;
     if(f.o.includes("No")){S.f[f.n]="No";n++;}}
    save();refresh();});
   card.querySelector("h2").appendChild(na);
  }
  for(const f of SCHEMA.fields){
   if(f.s!==sec)continue;
   const q=document.createElement("div");q.className="q";q.dataset.cond=f.c;q.dataset.field=f.n;
   let inner="<label class='main'>"+esc(f.l)+"</label>";
   if(f.t==="radio"){inner+="<div class='seg'>"+f.o.map(o=>"<button type='button' data-opt='"+esc(o)+"'>"+esc(o)+"</button>").join("")+"</div>";}
   else if(f.t==="select"){inner+="<select><option value=''>— select —</option>"+f.o.map(o=>"<option>"+esc(o)+"</option>").join("")+"</select>";}
   else if(f.t==="textarea"){inner+="<textarea placeholder='"+esc(f.p)+"'></textarea>";}
   else{inner+="<input type='"+f.t+"' placeholder='"+esc(f.p)+"'>";}
   q.innerHTML=inner;
   if(f.t==="radio"){q.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{S.f[f.n]=(S.f[f.n]===b.dataset.opt)?"":b.dataset.opt;save();refresh();}));}
   else{const el=q.querySelector("select,textarea,input");el.addEventListener("input",()=>{S.f[f.n]=el.value;if(f.n==="surveyor"){try{localStorage.setItem("rst-alex-surveyor",el.value);}catch{}}save();refreshLight();});el.addEventListener("change",()=>{S.f[f.n]=el.value;save();refresh();});}
   card.appendChild(q);
  }
  root.appendChild(card);
 }
}

async function geoForPostcode(pc){

 try{const c=localStorage.getItem("rst.travel.pc."+norm);if(c)return JSON.parse(c);}catch{}

  if(!r.ok)return null;const d=await r.json();

}

let LASTFIX=null;
function getFix(){return new Promise(res=>{
 if(!navigator.geolocation)return res(null);
 const t=setTimeout(()=>res(LASTFIX),5000);
 navigator.geolocation.getCurrentPosition(p=>{clearTimeout(t);
  LASTFIX={lat:+p.coords.latitude.toFixed(6),lon:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy)};
  res(LASTFIX);},()=>{clearTimeout(t);res(LASTFIX);},{enableHighAccuracy:true,timeout:4500,maximumAge:60000});});}
async function downscale(file,max){
 const bmp=await createImageBitmap(file);
 const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
 const cv=document.createElement("canvas");cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);
 cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
 return cv.toDataURL("image/jpeg",0.8);
}

function hMiles(a,b,c,d){const R=3958.7613,r=x=>x*Math.PI/180;const dl=r(c-a),dn=r(d-b);
 const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));}
async function distFor(addr){
 const m=/\b([A-Z]{1,2}\d[A-Z\d]?)\s*(\d[A-Z]{2})\b/i.exec(addr||"");if(!m)return null;
 const pc=(m[1]+m[2]).toUpperCase();
 try{const c=localStorage.getItem("rst.travel.pc."+pc);if(c){const p=JSON.parse(c);return Math.round(hMiles(TRAVEL_BASE.lat,TRAVEL_BASE.lon,p.lat,p.lon)*10)/10;}}catch{}
 try{const r=await fetch("https://api.postcodes.io/postcodes/"+pc,{signal:AbortSignal.timeout(6000)});
  if(!r.ok)return null;const d=await r.json();const la=d.result&&d.result.latitude,lo=d.result&&d.result.longitude;
  if(typeof la!=="number")return null;
  try{localStorage.setItem("rst.travel.pc."+pc,JSON.stringify({lat:la,lon:lo}));}catch{}
  return Math.round(hMiles(TRAVEL_BASE.lat,TRAVEL_BASE.lon,la,lo)*10)/10;
 }catch{return null;}
}

/* ---------- job pack file readers (native, no libs) ---------- */
async function inflateRaw(bytes){const ds=new DecompressionStream("deflate-raw");
 const st=new Blob([bytes]).stream().pipeThrough(ds);return new Uint8Array(await new Response(st).arrayBuffer());}
async function inflateZlib(bytes){
 let b=bytes;while(b.length&&(b[b.length-1]===10||b[b.length-1]===13||b[b.length-1]===32))b=b.slice(0,-1);
 for(let trim=0;trim<=4;trim++){
  try{const ds=new DecompressionStream("deflate");
   const st=new Blob([trim?b.slice(0,b.length-trim):b]).stream().pipeThrough(ds);
   return new Uint8Array(await new Response(st).arrayBuffer());}catch{}
 }
 throw new Error("deflate");}
function u16(b,o){return b[o]|b[o+1]<<8}function u32(b,o){return (b[o]|b[o+1]<<8|b[o+2]<<16|b[o+3]<<24)>>>0}
async function zipEntries(buf){
 const b=new Uint8Array(buf);let e=-1;
 for(let i=b.length-22;i>=0&&i>b.length-66000;i--){if(u32(b,i)===0x06054b50){e=i;break;}}
 if(e<0)throw new Error("zip");
 const n=u16(b,e+10);let off=u32(b,e+16);const out={};
 for(let i=0;i<n;i++){
  if(u32(b,off)!==0x02014b50)break;
  const method=u16(b,off+10),csize=u32(b,off+20),nlen=u16(b,off+28),xlen=u16(b,off+30),clen=u16(b,off+32),lho=u32(b,off+42);
  const name=new TextDecoder().decode(b.slice(off+46,off+46+nlen));
  out[name]={method,csize,lho};off+=46+nlen+xlen+clen;
 }
 return {b,out};
}
async function zipRead(z,name){
 const ent=z.out[name];if(!ent)return null;const b=z.b;const o=ent.lho;
 const nlen=u16(b,o+26),xlen=u16(b,o+28);const start=o+30+nlen+xlen;
 const data=b.slice(start,start+ent.csize);
 return ent.method===0?data:await inflateRaw(data);
}
async function readXlsxPairs(file){
 const z=await zipEntries(await file.arrayBuffer());
 const dec=new TextDecoder();const parse=x=>new DOMParser().parseFromString(dec.decode(x),"text/xml");
 const shX=await zipRead(z,"xl/sharedStrings.xml");const shared=[];
 if(shX){for(const si of parse(shX).getElementsByTagName("si")){let t="";for(const tt of si.getElementsByTagName("t"))t+=tt.textContent;shared.push(t);}}
 const s1=await zipRead(z,"xl/worksheets/sheet1.xml");if(!s1)return [];
 const doc=parse(s1);const rows={};
 for(const c of doc.getElementsByTagName("c")){
  const ref=c.getAttribute("r")||"";const m=ref.match(/([A-Z]+)(\d+)/);if(!m)continue;
  const v=c.getElementsByTagName("v")[0];if(!v)continue;
  const val=c.getAttribute("t")==="s"?shared[Number(v.textContent)]:v.textContent;
  (rows[m[2]]=rows[m[2]]||[]).push({col:m[1],val:String(val||"").trim()});
 }
 const pairs=[];
 for(const r in rows){const cells=rows[r].sort((a,b)=>a.col.length-b.col.length||(a.col<b.col?-1:1));
  for(let i=0;i<cells.length;i++){if(cells[i].val&&cells[i+1]&&cells[i+1].val)pairs.push([cells[i].val,cells[i+1].val]);}}
 return pairs;
}
async function readPdfText(file){
 const b=new Uint8Array(await file.arrayBuffer());
 const dec=new TextDecoder("latin1");const raw=dec.decode(b);
 let out=[];
 const re=/stream\r?\n/g;let m;
 while((m=re.exec(raw))){
  if(raw.slice(Math.max(0,m.index-3),m.index)==="end")continue;
  const end=raw.indexOf("endstream",re.lastIndex);if(end<0)break;
  let seg=b.slice(m.index+m[0].length,end);
  try{seg=await inflateZlib(seg);}catch{}
  const s=new TextDecoder("latin1").decode(seg);
  if(s.indexOf("Tj")<0&&s.indexOf("TJ")<0){re.lastIndex=end;continue;}
  for(const t of s.matchAll(/\((.*?)\)\s*Tj/g))out.push(t[1]);
  for(const arr of s.matchAll(/\[(.*?)\]\s*TJ/gs)){for(const p of arr[1].matchAll(/\((.*?)\)/g))out.push(p[1]);}
  re.lastIndex=end+9;
 }
 return out.join(" ").replace(/\\[()]/g,x=>x[1]);
}
function pngUnfilter(data,w,h,colors){
 const bpp=colors,rowLen=w*colors,stride=rowLen+1,out=new Uint8Array(rowLen*h);
 for(let y=0;y<h;y++){
  const ft=data[y*stride];const src=y*stride+1;const dst=y*rowLen;const prev=(y-1)*rowLen;
  for(let x=0;x<rowLen;x++){
   const raw=data[src+x];const left=x>=bpp?out[dst+x-bpp]:0;const up=y>0?out[prev+x]:0;const ul=(y>0&&x>=bpp)?out[prev+x-bpp]:0;
   let v;
   if(ft===0)v=raw;else if(ft===1)v=raw+left;else if(ft===2)v=raw+up;
   else if(ft===3)v=raw+((left+up)>>1);
   else{const p=left+up-ul,pa=Math.abs(p-left),pb=Math.abs(p-up),pc=Math.abs(p-ul);
    v=raw+(pa<=pb&&pa<=pc?left:pb<=pc?up:ul);}
   out[dst+x]=v&255;
  }
 }
 return out;
}
async function readPdfImages(file){
 const b=new Uint8Array(await file.arrayBuffer());
 const raw=new TextDecoder("latin1").decode(b);
 const out=[];
 const re=/<<([^]{0,600}?)>>\s*stream\r?\n/g;let m;
 while((m=re.exec(raw))){
  const dict=m[1];
  if(dict.indexOf("/Subtype/Image")<0)continue;
  const W=Number((dict.match(/\/Width\s+(\d+)/)||[])[1]||0);
  const H=Number((dict.match(/\/Height\s+(\d+)/)||[])[1]||0);
  if(!W||!H||W*H<10000)continue;
  const end=raw.indexOf("endstream",re.lastIndex);if(end<0)break;
  let seg=b.slice(m.index+m[0].length,end);
  try{
   if(dict.indexOf("/DCTDecode")>=0){
    out.push({blob:new Blob([seg],{type:"image/jpeg"}),w:W,h:H,area:W*H});
   }else if(dict.indexOf("/FlateDecode")>=0&&dict.indexOf("/DeviceRGB")>=0){
    let px=await inflateZlib(seg);
    const pred=Number((dict.match(/\/Predictor\s+(\d+)/)||[])[1]||1);
    if(pred>=10)px=pngUnfilter(px,W,H,3);
    if(px.length<W*H*3)throw new Error("px");
    const cv=document.createElement("canvas");cv.width=W;cv.height=H;
    const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,W,H);
    const id=cx.createImageData(W,H);
    for(let i=0,j=0;i<W*H;i++){id.data[i*4]=px[j++];id.data[i*4+1]=px[j++];id.data[i*4+2]=px[j++];id.data[i*4+3]=255;}
    cx.putImageData(id,0,0);
    const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.85));
    if(blob)out.push({blob,w:W,h:H,area:W*H});
   }
  }catch{}
  re.lastIndex=end;
 }
 out.sort((a,b2)=>b2.area-a.area);
 return out.slice(0,3);
}
/* ---------- deterministic prefill ---------- */
const REVIEW=new Set();
function setField(name,value,why){if(!value)return 0;const cur=(S.f[name]||"").trim();if(cur)return 0;
 S.f[name]=value;REVIEW.add(name);return 1;}
function ukDateIso(s){const m=String(s).match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(!m)return "";
 let y=m[3].length===2?"20"+m[3]:m[3];return y+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");}
function applyChecklistPairs(pairs){
 let hits=0;const get=lbl=>{const p=pairs.find(x=>x[0].toLowerCase().startsWith(lbl.toLowerCase()));return p?p[1]:"";};
 hits+=setField("sNumber",get("Service ID"));
 hits+=setField("surveyDate",ukDateIso(get("Survey Date")));
 hits+=setField("contactName",get("Site Contact"));
 hits+=setField("contactNumber",get("Tel Number"));
 hits+=setField("contactEmail",get("Email"));
 const addr=get("Company Address"),comp=get("Company Name");
 hits+=setField("siteAddress",[comp,addr].filter(Boolean).join(", "));
 const term=get("Termination Details");if(term)hits+=setField("internalCabling","Termination: "+term);
 const asb=get("Asbestos Register");if(asb)hits+=setField("asbestos",/^y/i.test(asb)?"Yes":"No");
 const extra=[];
 for(const lbl of ["Product","Presentation","UPRN","Timeslot","Route Approver Availability","Floor Plans","Listed Building","Access Restrictions","Induction Requirements","Permit Number","PPE Requirements","Parking Availability","Building or Landlord Contact"]){
  const v=get(lbl);if(v)extra.push(lbl+": "+v);}
 const freeC=pairs.filter(p=>/comments/i.test(p[0])).map(p=>p[1]).join(" ");
 const tail=pairs.length?pairs[pairs.length-1]:null;
 let notes="CHECKLIST: "+extra.join(" · ");
 const loose=pairs.map(p=>p[0]).filter(t=>t.length>25&&!/please|checklist|outsource/i.test(t));
 if(loose.length)notes+="\nCOMMENTS: "+loose.join(" ");
 hits+=setField("finalComments",notes);
 return hits;
}
function applyPdfHeuristics(text){
 let hits=0;const T=text.toUpperCase();
 const pn=T.match(/\b([A-Z]{2,4}-\d+-PN\d+)\b/);const sn=T.match(/\b([A-Z]{2,4}-\d+-PN\d+-SN\d+|\bSN\d+\b)/);
 if(pn){hits+=setField("pnCabinet","Yes");hits+=setField("pnRef",pn[1]);}
 if(sn){hits+=setField("snCabinet","Yes");hits+=setField("snRef",sn[1]);}
 if(/CIVILS/.test(T)){hits+=setField("civilsRequired","Yes");hits+=setField("civilsDescription",text.trim());}
 if(/TOBY|STRAW|LEAD[- ]?IN/.test(T)){hits+=setField("openreachUsed","Yes");}
 if(/STRAW/.test(T)){hits+=setField("strawConfirmed","Yes");}
 if(/CABL/.test(T)){hits+=setField("cablingRequired","Yes");hits+=setField("cablingDescription",text.trim());}
 return hits;
}
function markReview(){
 document.querySelectorAll(".q").forEach(q=>{const n=q.dataset.field;
  q.classList.toggle("review",REVIEW.has(n));
  if(REVIEW.has(n)&&!q.dataset.revwired){q.dataset.revwired="1";
   q.addEventListener("pointerdown",()=>{REVIEW.delete(n);q.classList.remove("review");},{once:true});}});
}
function applyPackData(pairs,pdfText){
 let hits=0;
 startSurveyDefaults();
 if(pairs)hits+=applyChecklistPairs(pairs);
 if(pdfText&&pdfText.trim())hits+=applyPdfHeuristics(pdfText);
 return hits;
}
async function aiMergeCombined(combined){
 if(!combined)return 0;
 try{const res=await aiCall({task:"jobpack",extractedText:combined.slice(0,8000),surveyTypeHint:"",images:[]});
  const j=(res&&res.json)||{};let ai=0;
  for(const k in AI_FIELD_MAP){const v=(j[k]||"").toString().trim();if(!v)continue;
   const f=SCHEMA.fields.find(x=>x.n===AI_FIELD_MAP[k]);if(f&&!(S.f[f.n]||"").trim()){S.f[f.n]=v;REVIEW.add(f.n);ai++;}}
  const pts=Array.isArray(j.points)?j.points:[];
  if(pts.length&&(!S.points||!S.points.length)){
   S.points=pts.map((p,i)=>({seq:Number(p.sequence||i+1)||i+1,
    title:String(p.title||p.interpretedRequirement||("Point "+(i+1))).slice(0,140),
    req:String(p.originalRequirement||p.interpretedRequirement||"").slice(0,300),
    asset:String(p.assetIdGuess||"")}));
   ai+=1;
  }
  return ai;
 }catch{return 0;}
}
document.getElementById("aifiles").addEventListener("change",async e=>{
 const msg=document.getElementById("aimsg");msg.textContent="Reading job packs…";
 try{
  const files=[...e.target.files];e.target.value="";
  // 1) ler tudo e detetar o S-number de cada ficheiro (nome do ficheiro > conteudo)
  const parsed=[];
  for(const file of files){
   const nm=file.name;const lower=nm.toLowerCase();
   let sid=(nm.match(/S\d{7}/i)||[""])[0].toUpperCase();
   let pairs=null,pdfText="";
   if(lower.endsWith(".xlsx")){pairs=await readXlsxPairs(file);
    if(!sid){const p=pairs.find(x=>x[0].toLowerCase().startsWith("service id"));sid=(p?p[1]:"").trim().toUpperCase();}}
   else if(lower.endsWith(".pdf")){pdfText=await readPdfText(file);
    if(!sid){const m=pdfText.toUpperCase().match(/\bS\d{7}\b/);if(m)sid=m[0];}}
   else continue;
   parsed.push({sid,pairs,pdfText,pdfFile:lower.endsWith(".pdf")?file:null});
  }
  if(!parsed.length){msg.textContent="No readable XLSX/PDF files.";return;}
  // 2) agrupar por S-number; ficheiros sem sid vao para o unico grupo existente
  const groups=new Map();
  for(const p of parsed){if(p.sid){const g=groups.get(p.sid)||{pairs:null,pdf:"",pdfFiles:[]};
   if(p.pairs&&!g.pairs)g.pairs=p.pairs;if(p.pdfText)g.pdf+=(g.pdf?"\n":"")+p.pdfText;
   if(p.pdfFile)g.pdfFiles.push(p.pdfFile);groups.set(p.sid,g);}}
  let orphan=0;
  for(const p of parsed){if(!p.sid){
   if(groups.size===1){const g=groups.values().next().value;
    if(p.pairs&&!g.pairs)g.pairs=p.pairs;if(p.pdfText)g.pdf+=(g.pdf?"\n":"")+p.pdfText;
    if(p.pdfFile)g.pdfFiles.push(p.pdfFile);}
   else{orphan++;groups.set("PACK-"+orphan,{pairs:p.pairs,pdf:p.pdfText,pdfFiles:p.pdfFile?[p.pdfFile]:[]});}}}
  // 3) criar/preencher um survey por grupo
  const made=[];let lastKey="";
  for(const [sid,g] of groups){
   if(!ALL.surveys[sid])ALL.surveys[sid]=blank(sid);
   ALL.current=sid;S=ALL.surveys[sid];
   if(!(S.f["sNumber"]||"").trim()&&sid.indexOf("PACK-")!==0)S.f["sNumber"]=sid;
   const hits=applyPackData(g.pairs,g.pdf);
   // mapas do PDF -> slots de plano
   let plans=0;
   for(const pf of (g.pdfFiles||[])){
    try{const imgs=await readPdfImages(pf);
     for(const im of imgs){
      const slot=plans===0?"civilsPlan":plans===1?"cablingPlan":"51";
      await phPut(pKey(slot,Date.now()+plans),im.blob);plans++;
     }}catch{}
   }
   const combined=((g.pairs?g.pairs.map(p=>p[0]+": "+p[1]).join("\n"):"")+"\n"+(g.pdf||"")).trim();
   const ai=await aiMergeCombined(combined);
   made.push(sid+" ("+(hits+ai)+" fields)");lastKey=sid;
  }
  save();
  if(groups.size===1){
   refresh();markReview();renderAllThumbs();void renderPow();void checkSite();
   msg.textContent="Survey "+(S.f["sNumber"]||lastKey)+" ready — "+made[0].split("(")[1].replace(")","")+" auto-filled. Amber = review.";
  }else{
   S=ALL.surveys[lastKey];refresh();markReview();renderAllThumbs();
   msg.textContent=groups.size+" surveys added to the work queue: "+made.join(" · ");
   listSurveys();dlg.showModal();
  }
 }catch(err){msg.textContent="Could not read a file: "+err;}
});

function paintOp(op){
 actx.strokeStyle=op.color;actx.fillStyle=op.color;actx.lineWidth=op.width;actx.lineCap="round";actx.lineJoin="round";
 if(op.t==="pen"){actx.beginPath();op.pts.forEach((p,i)=>i?actx.lineTo(p[0],p[1]):actx.moveTo(p[0],p[1]));actx.stroke();}
 else if(op.t==="circle"){const rx=Math.abs(op.x2-op.x1)/2,ry=Math.abs(op.y2-op.y1)/2;
  actx.beginPath();actx.ellipse((op.x1+op.x2)/2,(op.y1+op.y2)/2,Math.max(rx,2),Math.max(ry,2),0,0,Math.PI*2);actx.stroke();}
 else if(op.t==="arrow"){const dx=op.x2-op.x1,dy=op.y2-op.y1,len=Math.hypot(dx,dy)||1;
  actx.beginPath();actx.moveTo(op.x1,op.y1);actx.lineTo(op.x2,op.y2);actx.stroke();
  const hl=Math.max(14,op.width*2.6),ang=Math.atan2(dy,dx);
  actx.beginPath();actx.moveTo(op.x2,op.y2);
  actx.lineTo(op.x2-hl*Math.cos(ang-0.45),op.y2-hl*Math.sin(ang-0.45));
  actx.lineTo(op.x2-hl*Math.cos(ang+0.45),op.y2-hl*Math.sin(ang+0.45));
  actx.closePath();actx.fill();}
 else if(op.t==="text"){actx.font="bold "+Math.max(22,op.width*3.4)+"px -apple-system,sans-serif";
  actx.lineWidth=Math.max(3,op.width/2);actx.strokeStyle="rgba(0,0,0,.55)";
  actx.strokeText(op.text,op.x1,op.y1);actx.fillText(op.text,op.x1,op.y1);}
}

 }
 for(const f of SCHEMA.fields){
  if(f.s==="Point-of-Work Safety Check")continue;
  if(!condOk(f.c))continue;

function pdfEsc(s){return String(s).replace(/[\\()]/g,x=>"\\"+x).replace(/[^\x20-\x7e]/g,"?");}
function wrapText(s,n){const out=[];for(const rawLine of String(s).split(/\n/)){let line=rawLine;
 while(line.length>n){let cut=line.lastIndexOf(" ",n);if(cut<n*0.5)cut=n;out.push(line.slice(0,cut));line=line.slice(cut).trim();}
 out.push(line);}return out;}
async function blobToJpeg(blob,maxW){
 const bmp=await createImageBitmap(blob);
 const sc=Math.min(1,maxW/bmp.width);
 const cv=document.createElement("canvas");cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);
 cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
 const durl=cv.toDataURL("image/jpeg",0.72);
 const bin=atob(durl.split(",")[1]);const bytes=new Uint8Array(bin.length);
 for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
 return {bytes,w:cv.width,h:cv.height};
}

async function verifyPhoto(subject,el,file,keyPrefix){
 try{
  const keys=(await phKeys(keyPrefix+"::")).filter(k=>!k.endsWith("::orig"));
  const key=keys[keys.length-1];if(!key)return null;
  const dataUrl=await downscale(file,800);
  const res=await aiCall({task:"analyse_point",
   extractedText:"STRICT PHOTO VERIFICATION. Expected subject of this survey photo: \""+subject.t+"\". "+(subject.req?("Planner requirement: "+subject.req+". "):"")+
    "Start your finding with exactly MATCH: if the photo plausibly shows the expected subject and is usable (sharp enough, adequately lit, subject visible), or exactly MISMATCH: if it shows something else or is unusable (blurred, dark, obstructed). Then one short sentence of reason in UK English.",
   images:[{dataUrl,group:"verify",caption:"",key:"verify"}]});
  const j=(res&&res.json)||{};
  const finding=String(j.finding||res.text||"");
  let ok=true;
  if(/^\s*MISMATCH/i.test(finding))ok=false;
  else if(/^\s*MATCH/i.test(finding))ok=true;
  else if(/mismatch|does not show|cannot see|not visible|blurr|too dark|unusable/i.test(finding))ok=false;
  const note=finding.replace(/^\s*(MATCH|MISMATCH)\s*:?\s*/i,"").slice(0,220)||(ok?"Photo matches the expected subject.":"Photo may not match — check it.");
  S.verif=S.verif||{};S.verif[key]={ok,note};save();
  if(el){const box=el.querySelector("[data-thumbs]");if(box)await drawThumbsInto(box,keyPrefix+"::");}
  return {ok,note};
 }catch{return null;}
}

async function buildWizQueue(){

 for(const p of (S.points||[])){
  const n=keys.filter(k=>k.indexOf("::pow:"+p.seq+"::")>=0).length;
  if(!n)q.push({kind:"pow",id:"pow:"+p.seq,t:"Point "+p.seq+": "+p.title,why:p.req||p.title,seq:p.seq});
 }
 const bySlot={};for(const k of keys){const slot=k.split("::")[1];bySlot[slot]=(bySlot[slot]||0)+1;}

 if(planCount===0)q.push({kind:"slot",id:"civilsPlan",t:"GIS / overhead plan",why:"Load or photograph the network plan for this job."});
 const groupSeen=new Set();
 for(const sl of SCHEMA.slots){
  if(sl.c==="always")continue;if(!condOk(sl.c))continue;
  if(groupSeen.has(sl.c))continue;
  const cnt=[...SCHEMA.slots].filter(s2=>s2.c===sl.c).reduce((a,s2)=>a+(bySlot[s2.id]||0),0);

 document.getElementById("wizTitle").textContent=step.t;
 document.getElementById("wizWhy").textContent=step.why||"";
 document.getElementById("wizVerify").textContent="";
 document.getElementById("wizVerify").className="verify";
}
document.getElementById("guideBtn").addEventListener("click",async()=>{
 WIZ.queue=await buildWizQueue();WIZ.i=0;
 document.getElementById("wiz").classList.add("open");
 wizShow();
});
document.getElementById("wizClose").addEventListener("click",()=>{
 document.getElementById("wiz").classList.remove("open");
 void renderPow();renderAllThumbs();refreshLight();
});
document.getElementById("wizSkip").addEventListener("click",()=>{WIZ.i++;wizShow();});
document.getElementById("wizInput").addEventListener("change",async e=>{
 const file=e.target.files[0];e.target.value="";
 if(!file||WIZ.i>=WIZ.queue.length)return;
 const step=WIZ.queue[WIZ.i];
 const keyPrefix=ALL.current+"::"+step.id;
 const n=Date.now();
 await phPut(keyPrefix+"::"+n,file);
 void getFix().then(fx=>{if(fx){S.gps=S.gps||{};S.gps[step.id]=fx.lat+","+fx.lon;save();}});
 const v=document.getElementById("wizVerify");
 v.textContent="AI checking the photo…";v.className="verify";
 const subject={t:step.t,req:step.why};
 const res=await verifyPhoto(subject,null,file,keyPrefix);
 if(res&&!res.ok){
  v.className="verify warn";
  v.textContent="⚠ "+res.note+"  — retake, or Skip to keep it.";
 }else{
  if(res){v.className="verify ok";v.textContent="✓ "+res.note;}
  if(step.kind==="pow"){const p=(S.points||[]).find(pp=>"pow:"+pp.seq===step.id);
   if(p)void aiCaptionPow(p,document.createElement("div"),file);}
  else{const sl=SCHEMA.slots.find(s2=>s2.id===step.id);
   if(sl&&sl.com)void aiCaption(sl,document.querySelector(".slot[data-slot='"+sl.id+"']")||document.createElement("div"),file);}
  setTimeout(()=>{WIZ.i++;wizShow();},900);
 }
});

/* ---------- boot ---------- */
loadAll();
renderForm();
renderPhotos();
refresh();
void renderPow();
void checkSite();
void pullSync().then(async()=>{refresh();void renderPow();
 const got=await pullPhotosFor(ALL.current);
 if(got){renderAllThumbs();void renderPow();}});
</script>
</body>
</html>
